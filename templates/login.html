<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accesso · Auguri WhatsApp</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head>
<body class="login-page"><main class="login-card"><h1>🎂 Auguri WhatsApp</h1><p>Accesso amministratore</p>{% with ms=get_flashed_messages(with_categories=true) %}{% for c,m in ms %}<div class="flash {{c}}">{{m}}</div>{% endfor %}{% endwith %}<form method="post"><label>Password</label><input type="password" name="password" required autofocus><button class="primary">Accedi</button></form>{% if not configured %}<p class="muted">Configura prima <code>ADMIN_PASSWORD</code> nel file <code>.env</code>.</p>{% endif %}</main></body></html>
